<!doctype html>
<html lang="en-GB">

<style>[hidden]{display:none!important} body{margin:0} img{max-width:100%}
/* Course */
.course { display: flex; flex-direction: column; gap: 18px; }
.c-head { display: flex; flex-direction: column; gap: 10px; }
.c-prog { height: 6px; border-radius: 3px; background: var(--moss-soft); overflow: hidden; }
.c-prog span { display: block; height: 100%; background: var(--moss); border-radius: 3px; }
.lessons { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
.lesson-row { width: 100%; display: grid; grid-template-columns: 34px 1fr auto; gap: 12px; align-items: center; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--line); padding: 13px 2px; cursor: pointer; }
.lesson-row:hover { background: var(--moss-soft); }
.l-num { width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--moss); color: var(--moss); display: grid; place-items: center; font-size: 0.82rem; font-weight: 600; font-variant-numeric: tabular-nums; }
.l-num.done { background: var(--moss); color: var(--bg); }
.l-main { min-width: 0; display: flex; flex-direction: column; }
.l-title { font-family: var(--display); font-size: 1.2rem; font-weight: 600; color: var(--forest); line-height: 1.2; }
.l-sub { font-size: 0.8rem; color: var(--muted); }
.l-meta { font-size: 0.75rem; color: var(--muted); white-space: nowrap; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.c-lesson h2 { font-size: 1.6rem; }
.c-lead { font-family: var(--display); font-style: italic; color: var(--ember); font-size: 1.1rem; }
.c-card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 22px 22px 24px; display: flex; flex-direction: column; gap: 12px; min-height: 300px; animation: cardIn .25s ease-out; }
@keyframes cardIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.c-count { font-size: 0.72rem; letter-spacing: 0.12em; text-transform: uppercase; font-weight: 600; color: var(--ember); }
.c-card h3 { font-size: 1.55rem; }
.c-body { display: flex; flex-direction: column; gap: 10px; font-size: 1rem; line-height: 1.65; max-width: 60ch; }
.c-body p { margin: 0; }
.c-body ul { margin: 0; padding-left: 1.1em; display: flex; flex-direction: column; gap: 9px; }
.c-body li::marker { color: var(--ember); }
.c-body strong { color: var(--forest); font-weight: 600; }
.c-try { margin-top: auto; border-left: 3px solid var(--moss); background: var(--moss-soft); border-radius: 0 10px 10px 0; padding: 10px 14px; display: flex; flex-direction: column; gap: 2px; }
.c-try span { font-size: 0.7rem; letter-spacing: 0.12em; text-transform: uppercase; font-weight: 600; color: var(--moss); }
.c-try p { margin: 0; font-size: 0.93rem; }
.c-dots { display: flex; gap: 6px; justify-content: center; }
.c-dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--line); }
.c-dots i.past { background: var(--moss); opacity: 0.5; }
.c-dots i.on { background: var(--ember); width: 18px; border-radius: 4px; }
.btn:disabled { opacity: 0.45; cursor: default; }
@media (prefers-reduced-motion: reduce) { .c-card { animation: none; } }
@media (max-width: 520px) { .lesson-row { grid-template-columns: 34px 1fr; } .l-meta { display: none; } .c-card { padding: 18px 16px 20px; min-height: 340px; } }
</style>

<title>Dream Journal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* Layout: one calm column over a night woodland. Header with the tree mark, three tabs, then the page on a frosted panel.
   Deliberately a single dreamy night look, in every theme. */
:root {
  --bg: #0a0f1d;
  --surface: rgba(16, 22, 38, 0.80);
  --solid: #121a2c;
  --ink: #ece6da;
  --muted: #a9afbf;
  --line: rgba(236, 230, 218, 0.15);
  --forest: #f3ecdc;
  --moss: #a8c3a0;
  --ember: #e6b26e;
  --ember-soft: rgba(230, 178, 110, 0.14);
  --moss-soft: rgba(168, 195, 160, 0.12);
  --focus: #e6b26e;
  --display: "Cormorant Garamond", "Iowan Old Style", Georgia, serif;
  --body: "IBM Plex Sans", -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: dark;
}
#dreams { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; display: block; pointer-events: none; }
.wrap { position: relative; z-index: 1; }
.head { padding-top: 10vh; padding-bottom: 2vh; text-shadow: 0 2px 16px rgba(0,0,0,0.6); }
.tabs { text-shadow: 0 1px 10px rgba(0,0,0,0.7); }
#view { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 20px 18px; -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
#view textarea { background: rgba(255, 255, 255, 0.04); }
#view .c-card, #view .empty { background: rgba(255, 255, 255, 0.035); }
.foot { text-shadow: 0 1px 8px rgba(0,0,0,0.8); }
.a2hs { background: var(--solid) !important; }
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 56px;
  -webkit-font-smoothing: antialiased;
}
.wrap { max-width: 680px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }
h1, h2, h3 { font-family: var(--display); color: var(--forest); font-weight: 600; text-wrap: balance; margin: 0; line-height: 1.15; }
h1 { font-size: 2.4rem; font-weight: 500; }
h2 { font-size: 1.7rem; font-weight: 500; }
h3 { font-size: 1.25rem; }
p { margin: 0; }
button, input, textarea, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 4px; }

/* Header */
.brand { display: flex; align-items: center; gap: 10px; color: var(--forest); }
.brand svg { width: 28px; height: 28px; flex: none; }
.eyebrow { font-size: 0.72rem; letter-spacing: 0.14em; text-transform: uppercase; font-weight: 600; color: var(--forest); }
.head { display: flex; flex-direction: column; gap: 10px; }
.tagline { font-family: var(--display); font-style: italic; font-size: 1.15rem; color: var(--ember); }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); }
.tab {
  background: none; border: 0; padding: 10px 14px 9px; cursor: pointer; color: var(--muted);
  font-size: 0.9rem; font-weight: 500; border-bottom: 2px solid transparent; margin-bottom: -1px;
}
.tab[aria-selected="true"] { color: var(--forest); border-bottom-color: var(--ember); }
.store-note { font-size: 0.78rem; color: var(--muted); }

/* Buttons */
.btn {
  display: inline-flex; align-items: center; gap: 8px; border-radius: 999px; padding: 9px 18px;
  border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-size: 0.9rem; font-weight: 500;
}
.btn:hover { border-color: var(--moss); }
.btn.primary { background: var(--forest); color: var(--bg); border-color: var(--forest); }
.btn.primary:hover { opacity: 0.92; }
.btn.danger { color: var(--ember); border-color: var(--ember); background: transparent; }
.btn.ghost { background: transparent; border-color: transparent; color: var(--muted); padding-inline: 4px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.spread { justify-content: space-between; }

/* Journal list */
.list { display: flex; flex-direction: column; border-top: 1px solid var(--line); }
.item {
  display: grid; grid-template-columns: 44px 1fr auto; gap: 4px 12px; align-items: baseline;
  padding: 14px 4px; border-bottom: 1px solid var(--line); cursor: pointer; background: none; border-inline: 0; border-top: 0; text-align: left; width: 100%;
}
.item:hover { background: var(--moss-soft); }
.num { font-family: var(--display); font-size: 1.5rem; color: var(--ember); font-variant-numeric: tabular-nums lining-nums; line-height: 1; }
.item-main { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.item-title { font-family: var(--display); font-size: 1.25rem; font-weight: 600; color: var(--forest); line-height: 1.2; overflow-wrap: anywhere; }
.item-meta { font-size: 0.8rem; color: var(--muted); overflow-wrap: anywhere; }
.item-date { font-size: 0.78rem; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.chip { font-size: 0.72rem; padding: 1px 8px; border-radius: 999px; background: var(--moss-soft); color: var(--moss); font-weight: 500; }
.chip.sym { background: var(--ember-soft); color: var(--ember); }
.dots { display: inline-flex; gap: 3px; vertical-align: middle; }
.dots i { width: 6px; height: 6px; border-radius: 50%; border: 1px solid var(--moss); display: inline-block; }
.dots i.on { background: var(--moss); }

.empty { border: 1px dashed var(--line); border-radius: 14px; padding: 28px 22px; display: flex; flex-direction: column; gap: 12px; background: var(--surface); }
.empty p { color: var(--muted); max-width: 52ch; }

/* Editor */
.sheet { display: flex; flex-direction: column; gap: 26px; }
.sheet-head { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
.status { font-size: 0.78rem; color: var(--muted); margin-left: auto; }
.status.err { color: var(--ember); }
.section { display: flex; flex-direction: column; gap: 16px; padding-top: 18px; border-top: 1px solid var(--forest); }
.section-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.section-head .hint { font-family: var(--display); font-style: italic; color: var(--ember); font-size: 1.05rem; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.label { font-size: 0.72rem; letter-spacing: 0.12em; text-transform: uppercase; font-weight: 600; color: var(--forest); }
.label em { text-transform: none; letter-spacing: 0; font-weight: 400; color: var(--muted); font-size: 0.8rem; margin-left: 6px; }
input[type="text"], input[type="date"], input[type="time"], textarea {
  width: 100%; border: 0; border-bottom: 1px solid var(--line); background: transparent; padding: 6px 2px; border-radius: 0;
}
textarea { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--surface); resize: vertical; line-height: 1.65; }
input:focus, textarea:focus { outline: none; border-color: var(--moss); }
textarea.big { min-height: 220px; }
textarea.mid { min-height: 84px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }
.scale { display: flex; gap: 6px; }
.scale button {
  width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--moss); background: transparent; cursor: pointer;
  font-size: 0.8rem; color: var(--moss); font-variant-numeric: tabular-nums;
}
.scale button[aria-pressed="true"] { background: var(--moss); color: var(--bg); }
.pairs { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 3fr); gap: 0 14px; }
.pairs .ph { font-size: 0.7rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); padding-bottom: 2px; }
.arch { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 16px; }
.arch-sub { font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-top: 6px; }
.arch label { display: flex; gap: 10px; align-items: center; cursor: pointer; font-size: 0.92rem; }
.arch input { width: 17px; height: 17px; accent-color: var(--moss); }
.confirm { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 0.88rem; color: var(--ember); }

/* Symbols */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
th { text-align: left; font-size: 0.7rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--forest); font-weight: 600; padding: 8px 6px; border-bottom: 1px solid var(--forest); }
td { padding: 10px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
td.n { font-variant-numeric: tabular-nums; color: var(--ember); font-weight: 600; width: 3.5em; }
td.sym { font-family: var(--display); font-size: 1.15rem; color: var(--forest); font-weight: 600; }
.bars { display: flex; flex-direction: column; gap: 8px; }
.bar { display: grid; grid-template-columns: 9.5em 1fr 2em; gap: 10px; align-items: center; font-size: 0.88rem; }
.bar .track { height: 8px; border-radius: 4px; background: var(--moss-soft); overflow: hidden; }
.bar .fill { height: 100%; background: var(--moss); border-radius: 4px; }
.bar .c { font-variant-numeric: tabular-nums; color: var(--muted); text-align: right; }

/* Guide */
.guide { display: flex; flex-direction: column; border-top: 1px solid var(--line); }
details { border-bottom: 1px solid var(--line); }
summary { cursor: pointer; padding: 14px 2px; list-style: none; display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
summary::-webkit-details-marker { display: none; }
summary h3 { font-size: 1.35rem; }
summary .plus { color: var(--ember); font-size: 1.2rem; transition: transform .2s; }
details[open] summary .plus { transform: rotate(45deg); }
.g-body { padding: 0 2px 20px; display: flex; flex-direction: column; gap: 10px; max-width: 62ch; }
.g-lead { font-family: var(--display); font-style: italic; color: var(--ember); font-size: 1.1rem; }
.g-body ul { margin: 0; padding-left: 1.1em; display: flex; flex-direction: column; gap: 8px; }
.g-body li::marker { color: var(--ember); }
.g-body strong { color: var(--forest); font-weight: 600; }
.g-sub { font-size: 0.72rem; letter-spacing: 0.12em; text-transform: uppercase; font-weight: 600; color: var(--forest); margin-top: 6px; }

.foot { font-size: 0.78rem; color: var(--muted); display: flex; gap: 8px; align-items: center; border-top: 1px solid var(--line); padding-top: 14px; }
.toast { font-size: 0.82rem; color: var(--muted); }

@media (max-width: 520px) {
  h1 { font-size: 2rem; }
  .grid3 { grid-template-columns: 1fr 1fr; }
  .grid3 .wide { grid-column: 1 / -1; }
  .grid2 { grid-template-columns: 1fr; }
  .arch { grid-template-columns: 1fr 1fr; }
  .item { grid-template-columns: 36px 1fr; }
  .item-date { grid-column: 2; }
  .bar { grid-template-columns: 7.5em 1fr 1.6em; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<canvas id="dreams" aria-hidden="true"></canvas>
<div class="wrap">
  <header class="head">
    <div class="brand">
      <svg viewBox="0 0 100 100" aria-hidden="true">
        <circle cx="50" cy="50" r="45" fill="none" stroke="var(--moss)" stroke-width="3.5"/>
        <g stroke="currentColor" stroke-width="3.5" fill="none">
          <line x1="50" y1="12" x2="50" y2="88"/>
          <polyline points="32.5,47.5 50,30 67.5,47.5"/>
          <polyline points="36,59 50,45 64,59"/>
        </g>
      </svg>
      <span class="eyebrow">The Outdoor Practice</span>
    </div>
    <h1>Dream Journal</h1>
    <p class="tagline">Capture on waking. Reflect later.</p>
  </header>

  <nav class="tabs" role="tablist" aria-label="Sections">
    <button class="tab" role="tab" id="tab-journal" data-view="journal" aria-selected="true">Journal</button>
    <button class="tab" role="tab" id="tab-symbols" data-view="symbols" aria-selected="false">Symbols</button>
    <button class="tab" role="tab" id="tab-guide" data-view="guide" aria-selected="false">Guide</button>
  </nav>

  <main id="view" aria-live="polite"></main>

  <footer class="foot">
    <span id="store-note">Opening your journal…</span>
  </footer>
</div>

<script>
const CORE = ["Shadow", "Anima / Animus", "Persona", "Self"];
const TWELVE = ["Innocent", "Everyperson", "Hero", "Caregiver", "Explorer", "Rebel", "Lover", "Creator", "Jester", "Sage", "Magician", "Ruler"];
const ARCH = [...CORE, ...TWELVE, "Other"];
const LOCAL_KEY = "top-dream-journal-v1";

const state = {
  view: "journal",
  dreams: [],           // [{id, ...fields}]
  editingId: null,
  draft: null,
  dirty: false,
  mode: "loading",      // loading | cloud | local
  confirmDelete: false,
  status: "",
  statusErr: false,
};

let db = null, uid = null, col = null, saveTimer = null, saving = Promise.resolve(), downloads = null;

const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const today = () => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
const fmtDate = (s) => { if (!s) return ""; const d = new Date(s + "T12:00:00"); return isNaN(d) ? s : d.toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" }); };
const tags = (s) => String(s || "").split(",").map(t => t.trim()).filter(Boolean);

function blank() {
  return {
    date: today(), title: "", woke: "", vivid: 0, mood: "", dream: "",
    setting: "", figures: "", keyImage: "", feeling: "", symbols: "",
    context: "", images: ["", "", "", ""], assocs: ["", "", "", ""], archetypes: [],
    compensation: "", series: "", ask: "", created: Date.now(),
  };
}

function sorted() {
  return [...state.dreams].sort((a, b) => (a.date || "").localeCompare(b.date || "") || (a.created || 0) - (b.created || 0));
}
function numberOf(id) { const i = sorted().findIndex(d => d.id === id); return i < 0 ? sorted().length + 1 : i + 1; }
const pad = (n) => String(n).padStart(2, "0");

/* ---------- Storage ---------- */
function loadLocal() {
  try { const raw = localStorage.getItem(LOCAL_KEY); state.dreams = raw ? JSON.parse(raw) : []; } catch (e) { state.dreams = []; }
}
function saveLocalAll() {
  try { localStorage.setItem(LOCAL_KEY, JSON.stringify(state.dreams)); return true; } catch (e) { return false; }
}

async function init() {
  render();
  try {
    if (window.claude && claude.use) {
      const [d, u, dl] = await Promise.all([claude.use("db"), claude.use("user"), claude.use("downloads")]);
      downloads = dl;
      const id = u ? await u.id() : null;
      const canWrite = u ? await u.can("data.write") : null;
      if (d && id && canWrite !== false) {
        db = d; uid = id; col = db.collection("data/users/" + uid);
        state.mode = "cloud";
        col.onSnapshot(snap => {
          const incoming = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
          state.dreams = incoming;
          if (state.editingId && !state.dirty) {
            const fresh = incoming.find(x => x.id === state.editingId);
            if (fresh) state.draft = structuredClone(fresh);
          }
          if (state.view !== "edit") render(); else updateNote();
        }, () => { state.status = "Lost connection to your journal. Reload to try again."; state.statusErr = true; render(); });
        updateNote();
        return;
      }
    }
  } catch (e) { /* fall through to local */ }
  state.mode = "local"; loadLocal(); render();
}

function persist() {
  if (!state.draft) return;
  const data = structuredClone(state.draft);
  const id = state.editingId; delete data.id;
  state.status = "Saving…"; state.statusErr = false; paintStatus();
  if (state.mode === "cloud") {
    saving = saving.then(() => col.doc(id).set(data)).then(() => {
      state.dirty = false; state.status = "Saved"; paintStatus();
    }).catch(err => {
      if (err && err.code === "invalid_argument") {
        state.mode = "local"; loadLocal();
        const i = state.dreams.findIndex(x => x.id === id);
        if (i < 0) state.dreams.push({ id, ...data }); else state.dreams[i] = { id, ...data };
        const ok = saveLocalAll();
        state.dirty = false; state.statusErr = !ok;
        state.status = ok ? "Saved on this device" : "Couldn't save in this browser";
        updateNote(); paintStatus(); return;
      }
      state.statusErr = true;
      state.status = err && err.code === "quota_exceeded" ? "Your journal is full. Delete an old entry to save this one." : "Couldn't save just now. Keep this page open and try again in a moment.";
      paintStatus();
    });
  } else {
    const i = state.dreams.findIndex(d => d.id === id);
    const rec = { id, ...data };
    if (i < 0) state.dreams.push(rec); else state.dreams[i] = rec;
    const ok = saveLocalAll();
    state.dirty = false; state.status = ok ? "Saved on this device" : "Couldn't save in this browser"; state.statusErr = !ok; paintStatus();
  }
}
function scheduleSave() {
  state.dirty = true; state.status = "Editing…"; state.statusErr = false; paintStatus();
  clearTimeout(saveTimer); saveTimer = setTimeout(persist, 900);
}
function flush() { if (state.dirty) { clearTimeout(saveTimer); persist(); } }

async function removeDream(id) {
  if (state.mode === "cloud") {
    try { await saving; await col.doc(id).delete(); } catch (e) { state.status = "Couldn't delete. Try again."; state.statusErr = true; paintStatus(); return; }
  } else {
    state.dreams = state.dreams.filter(d => d.id !== id); saveLocalAll();
  }
  state.dreams = state.dreams.filter(d => d.id !== id);
  state.editingId = null; state.draft = null; state.dirty = false; state.confirmDelete = false;
  go("journal");
}

/* ---------- Guide: click-through course ---------- */
const COURSE_KEY = "top-dream-course-v1";
const COURSE = [
  { id: "start", title: "Getting started", lead: "How to use this journal, and keep your dreams safe.", cards: [
    { h: "Capture first", b: `<p>Dreams fade fast. Most slip away within minutes of waking, so the trick is to catch them before your feet hit the floor.</p><p>Tap <strong>New dream</strong> on the Journal tab and write it rough, in the present tense: "I am walking through a house…" Fragments count. A single image or a feeling is enough. It saves as you type.</p>`, t: "Leave your phone, with this journal open, by the bed tonight." },
    { h: "Reflect later", b: `<p>Capturing and reflecting are different jobs. Waking is for getting it down, not making sense of it.</p><p>Later, once you've had a brew, come back to the same dream and fill in the <strong>Reflect</strong> section: what was going on in your life, what each image means to you, any archetypes you notice, and what the dream might be asking of you.</p><p>No rush. Some dreams only open up days later.</p>` },
    { h: "Track your symbols", b: `<p>In each dream, add a few words to <strong>Symbols to track</strong>, separated by commas. Water, house, stag.</p><p>Over the weeks, the <strong>Symbols</strong> tab shows which images keep coming back, and in which dreams. Patterns you'd never spot in one dream become obvious across twenty.</p>` },
    { h: "Save it to your home screen", b: `<p>It then opens like an app, full screen, with the tree icon.</p><ul><li><strong>iPhone:</strong> open this page in Safari, tap <strong>Share</strong>, then <strong>Add to Home Screen</strong>.</li><li><strong>Android:</strong> open it in Chrome, tap the <strong>⋮</strong> menu, then <strong>Install app</strong> or <strong>Add to Home screen</strong>.</li></ul><p>Do this before you start, then always open it from the icon. On iPhone, the icon keeps its own copy of your dreams, separate from Safari.</p>` },
    { h: "Keep your dreams safe", b: `<p>Your dreams are saved in this browser, on this device only. Nothing is sent anywhere.</p><p>That's private, but fragile. Clearing your browsing data, using a private window or changing phone will lose them.</p><p>Tap <strong>Export</strong> on the Journal tab every week or so, and always before you clear your data or change phone. Keep the file somewhere safe. It's a copy to read and keep.</p>` },
  ]},
  { id: "what", title: "What Jungian dream work is", lead: "A conversation with the part of you that doesn't speak in words.", cards: [
    { h: "Listening, not decoding", b: `<p>Freud tended to see dreams as disguises: a hidden wish dressed up so we won't recognise it.</p><p>Jung saw it differently. For him the dream wasn't hiding anything. It was showing how things really stand inside, in the only language the unconscious has: images.</p><p>So the task isn't to crack a code. It's to listen, the way you'd listen to a friend who speaks in pictures.</p>` },
    { h: "Dreams balance us", b: `<p>Jung noticed that dreams often balance a one-sided waking attitude. He called this <em>compensation</em>.</p><p>Push hard in one direction by day and the dream pulls the other way by night. The person who's always the capable one dreams of being a lost child. The person keeping everything calm dreams of a storm.</p><p>Jung once dreamt of a patient sitting high on a castle tower. He had to crane his neck to see her, and realised he'd been looking down on her.</p>`, t: "With your next dream, ask: what have I been leaning too hard into lately?" },
    { h: "Your meaning comes first", b: `<p>Your own associations to an image matter more than anything a book says about it.</p><p>A dog might mean loyalty to one person and fear to another, depending on the dogs they've known.</p><p>Before you look anything up, ask: what does this mean to me? What does it remind me of? Where have I met it before?</p>` },
    { h: "Two ways to read a figure", b: `<p>A figure in a dream can be the real person. Or it can be a part of you, wearing their face. Jung called these the objective and subjective levels.</p><p>Dream about your boss, and it might be about your boss. Or it might be about your inner boss: the part of you that drives and judges.</p><p>Try both readings, and notice which one lands in your body.</p>` },
    { h: "Dreams look forward too", b: `<p>Some dreams point back at old wounds and patterns. Others seem to point towards what's trying to grow: a new direction, a quality you're ready to live.</p><p>It isn't prediction. It's more like a seed showing you what it might become.</p>` },
    { h: "Read them as a series", b: `<p>One dream is a sentence. Twenty dreams start to tell a story.</p><p>Jung often worked with a long run of someone's dreams, watching figures change and themes develop over months. That's why this journal tracks symbols and links between dreams.</p><p>Keep going, even when single dreams make no sense.</p>`, t: "Use the Series box to link a dream to earlier ones that feel related." },
  ]},
  { id: "isnt", title: "What it isn't", lead: "Hold it lightly. The dream is usually wiser than the interpretation.", cards: [
    { h: "Not a dictionary", b: `<p>A snake in your dream isn't the same as a snake in mine.</p><p>Jung was wary of fixed symbol lists. Dream dictionaries give one meaning for everyone, and that's exactly where they go wrong.</p><p>Start with what the image means to you. Myth and story can widen the view later.</p>` },
    { h: "Not fortune telling", b: `<p>Dreams speak about the inner situation: how you're feeling, what you're avoiding, what's changing in you.</p><p>They aren't forecasts. A dream of a car crash is far more likely to be about something in your life feeling out of control than about a real car.</p>` },
    { h: "Not something to force", b: `<p>Jung reminded himself that he didn't understand a dream before he began. Hold it lightly.</p><p>If nothing lands, let it be. Meaning often arrives days later, on a walk, in the shower, or halfway through a conversation.</p><p>A good dream can hold several meanings at once. Come back to it.</p>` },
    { h: "Choose the surprise", b: `<p>If an interpretation only tells you what you already know, or makes you look good, keep looking.</p><p>Dreams tend to bring news, not repeat the headlines. The reading that's a little uncomfortable, or makes you go "oh", is often nearer the mark.</p>` },
    { h: "Not a replacement for support", b: `<p>If dreams stir up something heavy, like recurring nightmares or old trauma, bring them to a therapist or someone you trust. You don't have to sit with that alone.</p><p>Dream work is powerful. It's fine to go slowly, or put it down for a while.</p>` },
  ]},
  { id: "symbols", title: "Signs and symbols", lead: "A sign points to something known. A symbol points beyond what we can say.", cards: [
    { h: "Sign or symbol?", b: `<p>Jung drew a clear line here.</p><p>A road sign or a logo is a <em>sign</em>. It stands for something we already understand.</p><p>A <em>symbol</em> carries more than words can hold. Part of it always stays in shadow, and that's where its power comes from.</p>` },
    { h: "They arise by themselves", b: `<p>We don't make dream symbols up on purpose. They arise by themselves, the way mushrooms push up after rain.</p><p>That's why they can surprise us, and why they often seem to know something we don't yet.</p>` },
    { h: "How to spot a living symbol", b: `<ul><li><strong>It has charge.</strong> You feel something in the body. It grips, unsettles or moves you.</li><li><strong>It won't sit still.</strong> Every explanation feels true, but never quite enough.</li><li><strong>It comes back.</strong> Recurring images are asking for attention. Tag them so they show on the Symbols tab.</li></ul>` },
    { h: "Stay close to the image", b: `<p>Freud's free association lets one thought lead to the next, often far from the dream.</p><p>Jung preferred to circle back to the image itself, again and again. Describe it as if to someone who's never seen one. What exactly does it look like? What does it do? What does it remind you of?</p>`, t: "Pick one image from a recent dream and describe it in five detailed sentences." },
    { h: "Live with it", b: `<p>You don't have to explain a symbol to work with it.</p><p>Draw it. Walk with it. Notice where it turns up in waking life. Living alongside a symbol for a while often teaches more than analysing it.</p>` },
  ]},
  { id: "myth", title: "Myth and the bigger story", lead: "Myths are humanity's shared dreams. Dreams are your personal myths.", cards: [
    { h: "Bigger than one life", b: `<p>Some dream images feel bigger than one person's life. A descent underground. A great tree. A journey into the belly of a beast.</p><p>These turn up in myth, fairy tale and religion across the world. Jung linked them to <em>archetypes</em>: deep patterns in the psyche we all share, which take on different images in different cultures.</p>` },
    { h: "Amplification", b: `<p>When an image feels big and strange, Jung would widen the circle. He'd look at how the same motif appears in myth and story, to see what it might carry.</p><p>Personal associations always come first. Then ask: where else does this story live?</p>` },
    { h: "The descent", b: `<p>Inanna, Persephone and Orpheus all go down into the underworld, and come back changed.</p><p>A dream of going underground, into a cellar, a cave or deep water, might belong to this old story: a time of going down before you can come back up.</p>` },
    { h: "The dark and the tree", b: `<p><strong>The night sea journey.</strong> Jonah is swallowed by the great fish and held in the dark before being released. Being swallowed or enclosed in a dream can echo this: a pause before rebirth.</p><p><strong>The world tree.</strong> Yggdrasil in Norse myth links the worlds above and below. A tree in a dream may be more than a tree.</p>`, t: "Think of a fairy tale you loved as a child. Is any part of it alive in you now?" },
    { h: "Go gently", b: `<p>Myth widens the view. It doesn't replace your own meaning.</p><p>And treat other cultures' stories with respect. Borrow lightly, and credit where they come from.</p>` },
  ]},
  { id: "core", title: "Jung's core archetypes", lead: "Patterns, not boxes. They show up as people, animals, places and moods.", cards: [
    { h: "Patterns, not boxes", b: `<p>Jung saw archetypes as deep patterns we all share, not a fixed list. He wrote most about a handful of core figures.</p><p>They rarely announce themselves. They show up as people, animals, places and moods, and you recognise them by the feeling they carry.</p>` },
    { h: "The Shadow", b: `<p>The parts of ourselves we reject, or simply don't see.</p><p>In dreams it often appears as someone who irritates, frightens or chases us. What annoys us most in other people can point here too.</p><p>The Shadow isn't only dark. It also holds gold: strengths we've disowned, like anger that could become healthy boundaries.</p>`, t: "Who makes you uneasy in your dreams? What quality do they have that you don't allow in yourself?" },
    { h: "Anima / Animus", b: `<p>The inner other. Jung described it as a figure of a different gender to the dreamer, and many people still meet it that way.</p><p>It often appears as a mysterious stranger, a guide or a lover, leading towards feeling, depth and creativity.</p><p>Many people working with Jung today see it less in gender terms, and more as the inner figure that draws us towards what we haven't yet lived.</p>` },
    { h: "The Persona", b: `<p>The mask we wear for the world. We all need one. It gets us through work, school and the supermarket.</p><p>Trouble comes when we confuse the mask with who we are.</p><p>Dreams of clothes, uniforms, or being naked or exposed in public often point here.</p>` },
    { h: "The Self", b: `<p>The whole of us: the centre that holds everything, light and dark.</p><p>It can appear as a circle, a mandala, a precious stone, a wise figure, a special child or a sacred place.</p><p>Jung called the lifelong journey towards the Self <em>individuation</em>: becoming more fully who you are.</p>` },
  ]},
  { id: "twelve", title: "The twelve archetypes", lead: "Each has a gift, and a shadow side.", cards: [
    { h: "Where the twelve come from", b: `<p>The popular twelve archetypes aren't Jung's own list. They come from Carol S. Pearson, building on his ideas, in <em>Awakening the Heroes Within</em>, and later <em>The Hero and the Outlaw</em> with Margaret Mark.</p><p>They're useful because each one has a gift and a shadow side. You'll see other names for some of them in brackets.</p>` },
    { h: "Innocent, Everyperson, Hero", b: `<ul><li><strong>Innocent.</strong> Trust, hope, goodness. Shadow: denial, not seeing what's real.</li><li><strong>Everyperson</strong> (Orphan). Belonging, realism, being one of us. Shadow: losing yourself to fit in.</li><li><strong>Hero</strong> (Warrior). Courage, rising to a challenge. Shadow: always needing a battle to prove your worth.</li></ul>` },
    { h: "Caregiver, Explorer, Rebel", b: `<ul><li><strong>Caregiver.</strong> Nurture and protection. Shadow: giving until you're empty.</li><li><strong>Explorer</strong> (Seeker). Freedom and the call of the unknown. Shadow: restlessness, never landing.</li><li><strong>Rebel</strong> (Outlaw). Breaking what no longer works. Shadow: destruction for its own sake.</li></ul>` },
    { h: "Lover, Creator, Jester", b: `<ul><li><strong>Lover.</strong> Intimacy, passion, beauty. Shadow: losing yourself in another.</li><li><strong>Creator.</strong> Imagination, making something new. Shadow: perfectionism.</li><li><strong>Jester</strong> (Fool). Play, joy, living in the moment. Shadow: hiding pain behind a joke.</li></ul>` },
    { h: "Sage, Magician, Ruler", b: `<ul><li><strong>Sage.</strong> Truth and understanding. Shadow: living in your head, cut off from feeling.</li><li><strong>Magician.</strong> Transformation, making things happen. Shadow: manipulation.</li><li><strong>Ruler.</strong> Order, responsibility, holding things together. Shadow: control for its own sake.</li></ul>` },
    { h: "Using them", b: `<p>In the Reflect section, tick any you notice in a dream figure, or in how you were in the dream. The Symbols tab counts them over time.</p><p>If a figure doesn't fit, tick Other and describe it in your own words. Personal meaning first.</p>`, t: "Which of the twelve feels strongest in you right now? Which is missing?" },
  ]},
  { id: "work", title: "Working with a dream", lead: "Six steps. No rush. Everything here is an invitation.", cards: [
    { h: "A simple path", b: `<p>This loosely follows Robert A. Johnson's four-step approach in <em>Inner Work</em>, with two steps added at the start: capturing the dream, and noticing the feeling.</p><p>The Capture section of each entry holds the first two steps. Reflect holds the rest.</p>` },
    { h: "1. Write it down", b: `<p>As it was, in the present tense. Don't tidy it up, and don't explain it yet.</p><p>Include the odd details, the bits that don't fit, and how the dream ended. Fragments count.</p>` },
    { h: "2. Notice the feeling", b: `<p>Where is the dream in your body? A tight chest, a lump in the throat, a strange lightness?</p><p>Feeling is often the clearest thread back into a dream, even when the story is gone.</p>` },
    { h: "3. Associate", b: `<p>Take each image in turn. What does it mean to you? What does it remind you of?</p><p>Stay close to the image. Don't let one thought lead to the next until you're miles from the dream. Keep coming back.</p>` },
    { h: "4. Connect", b: `<p>Where is this alive in your life right now?</p><p>Which part of you might this figure be? What's going on at work, at home, in your body, that the dream might be speaking to?</p>` },
    { h: "5. Interpret, lightly", b: `<p>Ask what the dream might be balancing. Put it into a sentence or two.</p><p>Choose the meaning that surprises you over the one that flatters you. If it only tells you what you already know, keep looking.</p>` },
    { h: "6. Honour it", b: `<p>Do something small and physical. Walk to the place the dream reminded you of. Light a candle. Sketch the image. Carry a stone.</p><p>This brings the dream into the body and into the world, and tells the deeper part of you that you're listening.</p>`, t: "Pick one small act to honour your next dream." },
  ]},
  { id: "reading", title: "Further reading", lead: "Take what you need. Leave the rest on the shelf.", cards: [
    { h: "Where to go next", b: `<ul><li><strong>Man and His Symbols.</strong> Carl Jung and colleagues, 1964. The most accessible way in.</li><li><strong>Inner Work.</strong> Robert A. Johnson, 1986. A practical, plain-spoken guide to dreams and active imagination.</li><li><strong>Memories, Dreams, Reflections.</strong> Jung's late-life autobiography, full of his own dreams.</li><li><strong>Dreams.</strong> Carl Jung. His key essays on dreams.</li><li><strong>Awakening the Heroes Within.</strong> Carol S. Pearson. The twelve archetypes.</li></ul>` },
    { h: "Come as you are", b: `<p>That's the course. Come back to any lesson whenever you need it.</p><p>If a dream stays with you, bring it to The Outdoor Practice community. Some images are easier to hold together.</p><p>rewildingtherapies.com</p>` },
  ]},
];
const course = { lesson: null, card: 0, finished: false };
function courseDone() { try { return new Set(JSON.parse(localStorage.getItem(COURSE_KEY)) || []); } catch (e) { return new Set(); } }
function markDone(id) { const s = courseDone(); s.add(id); try { localStorage.setItem(COURSE_KEY, JSON.stringify([...s])); } catch (e) {} }
function courseHTML() {
  const done = courseDone();
  if (!course.lesson) {
    const n = COURSE.filter(l => done.has(l.id)).length;
    const next = COURSE.find(l => !done.has(l.id)) || COURSE[0];
    return `<div class="course">
      <div class="c-head"><h2>The Guide</h2><p class="toast">${COURSE.length} short lessons on Jungian dream work. A few minutes each. Take them in order, or dip in.</p>
        <div class="c-prog" role="progressbar" aria-valuemin="0" aria-valuemax="${COURSE.length}" aria-valuenow="${n}"><span style="width:${Math.round(n / COURSE.length * 100)}%"></span></div>
        <div class="row spread"><span class="toast">${n} of ${COURSE.length} done</span><button class="btn primary" data-lesson="${next.id}">${n ? (n === COURSE.length ? "Start again" : "Continue") : "Start"}: ${esc(next.title)}</button></div></div>
      <ol class="lessons">${COURSE.map((l, i) => `<li><button class="lesson-row" data-lesson="${l.id}">
        <span class="l-num ${done.has(l.id) ? "done" : ""}" aria-hidden="true">${done.has(l.id) ? "✓" : i + 1}</span>
        <span class="l-main"><span class="l-title">${esc(l.title)}</span><span class="l-sub">${esc(l.lead)}</span></span>
        <span class="l-meta">${l.cards.length} cards${done.has(l.id) ? '<span class="sr"> · done</span>' : ""}</span></button></li>`).join("")}</ol></div>`;
  }
  const li = COURSE.findIndex(l => l.id === course.lesson), L = COURSE[li];
  const top = `<div class="row spread"><button class="btn ghost" data-course="menu">← All lessons</button><span class="toast">Lesson ${li + 1} of ${COURSE.length}</span></div>`;
  if (course.finished) {
    const nx = COURSE[li + 1];
    return `<div class="course">${top}<article class="c-card c-end"><span class="c-count">Lesson done</span><h3>${esc(L.title)}</h3><p>Nice work. Come back to it any time.</p>
      <div class="row">${nx ? `<button class="btn primary" data-lesson="${nx.id}">Next: ${esc(nx.title)}</button>` : ""}<button class="btn" data-course="journal">Back to the journal</button><button class="btn ghost" data-course="menu">All lessons</button></div></article></div>`;
  }
  const C = L.cards[course.card], last = course.card === L.cards.length - 1;
  return `<div class="course">${top}
    <div class="c-lesson"><h2>${esc(L.title)}</h2><p class="c-lead">${esc(L.lead)}</p></div>
    <article class="c-card" id="c-card" aria-live="polite">
      <span class="c-count">${course.card + 1} of ${L.cards.length}</span>
      <h3>${esc(C.h)}</h3><div class="c-body">${C.b}</div>
      ${C.t ? `<div class="c-try"><span>Try this</span><p>${esc(C.t)}</p></div>` : ""}
    </article>
    <div class="c-dots" aria-hidden="true">${L.cards.map((_, i) => `<i class="${i === course.card ? "on" : i < course.card ? "past" : ""}"></i>`).join("")}</div>
    <div class="row spread"><button class="btn" data-course="back" ${course.card === 0 ? "disabled" : ""}>Back</button>
      <button class="btn primary" data-course="next">${last ? "Finish lesson" : "Next"}</button></div>
  </div>`;
}
function openLesson(id, card) { course.lesson = id; course.card = card || 0; course.finished = false; go("guide"); }
function courseNav(dir) {
  const L = COURSE.find(l => l.id === course.lesson); if (!L || course.finished) return;
  if (dir > 0) { if (course.card < L.cards.length - 1) course.card++; else { markDone(L.id); course.finished = true; } }
  else if (course.card > 0) course.card--;
  render(); const c = document.getElementById("c-card") || document.querySelector(".c-end"); if (c) c.scrollIntoView({ block: "nearest" });
}
let touchX = null;
document.addEventListener("touchstart", e => { if (state.view === "guide" && course.lesson && e.target.closest(".c-card")) touchX = e.touches[0].clientX; }, { passive: true });
document.addEventListener("touchend", e => { if (touchX === null) return; const dx = e.changedTouches[0].clientX - touchX; touchX = null; if (Math.abs(dx) > 50) courseNav(dx < 0 ? 1 : -1); });
document.addEventListener("keydown", e => { if (state.view !== "guide" || !course.lesson || /INPUT|TEXTAREA/.test(document.activeElement.tagName)) return; if (e.key === "ArrowRight") courseNav(1); if (e.key === "ArrowLeft") courseNav(-1); });

/* ---------- Navigation ---------- */
function go(view) {
  if (state.view === "edit" && view !== "edit") flush();
  state.view = view;
  document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-selected", String(t.dataset.view === view || (view === "edit" && t.dataset.view === "journal"))));
  render(); window.scrollTo({ top: 0 });
}
function openDream(id) {
  const d = state.dreams.find(x => x.id === id);
  state.editingId = id; state.draft = structuredClone({ ...blank(), ...d }); state.dirty = false;
  state.confirmDelete = false; state.status = ""; go("edit");
}
function newDream() {
  const id = "dream-" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  state.editingId = id; state.draft = blank(); state.confirmDelete = false; state.status = "";
  state.dirty = false; go("edit");
}

/* ---------- Rendering ---------- */
function updateNote() {
  const n = $("#store-note");
  if (state.mode === "cloud") n.textContent = "Private to you. Saved to your account, so it follows you across devices.";
  else if (state.mode === "local") n.textContent = "Saved in this browser only, on this device. Export a copy now and again, and always before clearing your browsing data.";
  else n.textContent = "Opening your journal…";
}
function paintStatus() { const s = $("#status"); if (s) { s.textContent = state.status; s.classList.toggle("err", state.statusErr); } }

function render() {
  updateNote();
  const v = $("#view");
  if (state.mode === "loading") { v.innerHTML = `<p class="toast">Opening your journal…</p>`; return; }
  if (state.view === "journal") v.innerHTML = journalHTML();
  else if (state.view === "symbols") v.innerHTML = symbolsHTML();
  else if (state.view === "guide") v.innerHTML = courseHTML();
  else if (state.view === "edit") { v.innerHTML = editHTML(); bindEditor(); }
}

function vividDots(n) { return `<span class="dots" aria-label="Vividness ${n || 0} of 5">${[1,2,3,4,5].map(i => `<i class="${i <= n ? "on" : ""}"></i>`).join("")}</span>`; }

function journalHTML() {
  const list = sorted().reverse();
  const top = `<div class="row spread"><h2>${list.length ? list.length + (list.length === 1 ? " dream" : " dreams") : "Your dreams"}</h2>
    <div class="row">${list.length ? `<button class="btn ghost" id="export">Export</button>` : ""}<button class="btn primary" id="new">+ New dream</button></div></div>`;
  if (!list.length) {
    return `<div class="sheet">${top}
      <div class="empty">
        <h3>Nothing here yet</h3>
        <p>Your dreams will gather here, newest first, with their key image and any archetypes you noticed. Tap <strong>New dream</strong> the moment you wake. Capture it rough, then come back later to reflect.</p>
        <p>New to this? The <strong>Guide</strong> tab is a short course: how to use this journal, then bite-size lessons on Jungian dream work.</p>
      </div></div>${exportStatus()}`;
  }
  const total = sorted();
  return `<div class="sheet">${top}<div class="list">${list.map(d => {
    const n = total.indexOf(d) + 1;
    const syms = tags(d.symbols).slice(0, 4);
    const arch = (d.archetypes || []).slice(0, 3);
    return `<button class="item" data-id="${esc(d.id)}">
      <span class="num">${pad(n)}</span>
      <span class="item-main">
        <span class="item-title">${esc(d.title || "Untitled dream")}</span>
        <span class="item-meta">${d.keyImage ? esc(d.keyImage) + " · " : ""}${d.mood ? esc(d.mood) + " · " : ""}${vividDots(d.vivid)}</span>
        ${syms.length || arch.length ? `<span class="chips">${syms.map(s => `<span class="chip sym">${esc(s)}</span>`).join("")}${arch.map(a => `<span class="chip">${esc(a)}</span>`).join("")}</span>` : ""}
      </span>
      <span class="item-date">${esc(fmtDate(d.date))}</span>
    </button>`;
  }).join("")}</div></div>${exportStatus()}`;
}
let exportMsg = "";
function exportStatus() { return exportMsg ? `<p class="toast">${esc(exportMsg)}</p>` : ""; }

function symbolsHTML() {
  const all = sorted();
  const map = new Map();
  all.forEach((d, i) => tags(d.symbols).forEach(t => {
    const k = t.toLowerCase(); if (!map.has(k)) map.set(k, { name: t, nums: [] });
    const e = map.get(k); if (!e.nums.includes(i + 1)) e.nums.push(i + 1);
  }));
  const syms = [...map.values()].sort((a, b) => b.nums.length - a.nums.length || a.name.localeCompare(b.name));
  const names = [...new Set(all.flatMap(d => d.archetypes || []))];

function exportText() {
  return sorted().map((d, i) => {
    const L = [`# Dream ${pad(i + 1)}: ${d.title || "Untitled"}`, `${fmtDate(d.date)}${d.woke ? " · woke " + d.woke : ""}${d.vivid ? " · vivid " + d.vivid + "/5" : ""}${d.mood ? " · " + d.mood : ""}`, "", d.dream || "", ""];
    [["Setting", d.setting], ["Figures", d.figures], ["Key image", d.keyImage], ["Feeling", d.feeling], ["Symbols", d.symbols], ["Context", d.context]].forEach(([k, val]) => { if (val) L.push(`**${k}:** ${val}`); });
    (d.images || []).forEach((im, j) => { if (im || (d.assocs || [])[j]) L.push(`- ${im}: ${(d.assocs || [])[j] || ""}`); });
    if ((d.archetypes || []).length) L.push(`**Archetypes:** ${d.archetypes.join(", ")}`);
    [["Compensation", d.compensation], ["Series", d.series], ["What it asks of me", d.ask]].forEach(([k, val]) => { if (val) L.push(`**${k}:** ${val}`); });

  var android = /Android/i.test(ua);
  var icon = (document.querySelector('link[rel="apple-touch-icon"]') || {}).href || "";
  var shareSvg = '<svg class="a2hs-share" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="M8 7l4-4 4 4"/><path d="M5 11v8a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-8"/></svg>';
  var deferred = null, el = null, spacer = null;

  function later() {
    try { localStorage.setItem(KEY, String(Date.now() + 14 * 24 * 3600 * 1000)); } catch (e) {}
    hide();
  }
  function hide() { if (el) el.remove(); if (spacer) spacer.remove(); el = spacer = null; }
  function show(html, actions) {
    hide();
    el = document.createElement("aside");
    el.className = "a2hs"; el.setAttribute("aria-label", "Add to home screen");
    el.innerHTML = '<div class="a2hs-in">' + (icon ? '<img class="a2hs-icon" src="' + icon + '" alt="">' : "") +
      '<div class="a2hs-text">' + html + '<div class="a2hs-actions">' + actions + '<button class="a2hs-btn" data-a2hs="later">Not now</button></div></div></div>';
    document.body.appendChild(el);
    spacer = document.createElement("div");
    spacer.style.height = (el.offsetHeight + 16) + "px";
    document.body.appendChild(spacer);
    el.addEventListener("click", function (e) {
      var b = e.target.closest("[data-a2hs]"); if (!b) return;
      if (b.dataset.a2hs === "later") later();
      if (b.dataset.a2hs === "install" && deferred) {
        deferred.prompt();
        deferred.userChoice.then(function (c) { if (c && c.outcome === "accepted") hide(); deferred = null; });
      }
    });
  }

  if (inApp) {
    show("<b>Open in your browser to save " + NAME + "</b>This app can't be saved from inside Instagram or Facebook. Tap the menu (⋯ or ⋮) and choose <strong>Open in browser</strong>, or <strong>Open in Safari</strong>.", "");
  } else if (ios) {
    show("<b>Add " + NAME + " to your home screen</b>Tap " + shareSvg + " <strong>Share</strong>, then <strong>Add to Home Screen</strong>. It opens like an app." +
      "<small>Do this before you start, then always open it from the icon. Your entries stay with the icon.</small>", "");
  } else if (android) {
    show("<b>Add " + NAME + " to your home screen</b>Tap the <strong>⋮</strong> menu, then <strong>Install app</strong> or <strong>Add to Home screen</strong>. It opens like an app.", "");
  }

  window.addEventListener("beforeinstallprompt", function (e) {
    e.preventDefault(); deferred = e;
    try { if (Date.now() < +(localStorage.getItem(KEY) || 0)) return; } catch (err) {}
    show("<b>Install " + NAME + "</b>Add it to your home screen and it opens like an app.", '<button class="a2hs-btn go" data-a2hs="install">Install app</button>');
  });
  window.addEventListener("appinstalled", hide);
})();
</script>
